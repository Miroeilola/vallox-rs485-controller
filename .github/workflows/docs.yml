# Documentation hygiene: no dead links, no leftover placeholders in published docs.
name: docs

on:
  push:
    paths: ['**/*.md', '.github/workflows/docs.yml']
  pull_request:
  workflow_dispatch:

jobs:
  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on unresolved placeholders and TODO markers
        run: |
          if grep -rnE '\{\{[A-Z_]+\}\}|\bTBD\b|\bTODO\b' \
               --include='*.md' --include='*.yaml' . ; then
            echo "::error::Unresolved placeholders or TODO markers in published documents"
            exit 1
          fi
          echo "No placeholders found."

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository's own URLs and CI badges 404 for an anonymous checker
      # while the repository is private. Remove this exclusion at the same time
      # the repository is made public - it is the one link check that matters
      # most once anyone can follow them.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude-path LICENSES --accept 200,429
            --exclude 'github\.com/Miroeilola/vallox-rs485-controller'
            '**/*.md'
          fail: true
