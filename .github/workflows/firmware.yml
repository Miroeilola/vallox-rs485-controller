# Firmware build and host-side unit tests.
# Unit tests run on the runner (no hardware needed) and are the gate that matters
# for protocol parsing, checksums and state machines.
name: firmware

on:
  push:
    paths: ['firmware/**', 'scripts/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'scripts/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: |
          cd firmware/test/host
          make test
      - name: Upload golden images and a rendered panel
        if: always()
        run: |
          cd firmware/test/host
          make panel_host || true
          ./panel_host --ticks 150 --png panel-dashboard.png || true
          ./panel_host --ticks 150 --fault 5 --lang fi --png panel-fault-fi.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-renders
          path: |
            firmware/test/host/panel-*.png
            firmware/test/host/golden/*.actual.png
          if-no-files-found: ignore
      - name: Host tests under ASan/UBSan
        run: |
          cd firmware/test/host
          make clean
          CFLAGS="-std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all" make test
      - name: Check the emulator's register table against protocol.md
        run: python3 scripts/check-machine-regs.py
      - name: Build the capture decoder
        run: |
          cd scripts/vlx-decode
          make check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.3
          target: esp32s3
          path: firmware
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/flash_args
