# Project metadata. Read by workspace tooling (/pcba-order, /datasheet, /projektit).
name: Vallox RS-485 Controller
slug: vallox-rs485-controller
visibility: public          # public | client | internal
status: development                 # development | review | released | discontinued
created: 2026-08-21
designer: Miro Eilola / Mironet

description: |
  Replacement bus controller for legacy Vallox ventilation units. Joins the Vallox
  DIGIT RS-485 panel bus as an additional client, powered from the panel connector,
  and exposes temperatures, fan speed and machine status over Wi-Fi to Home
  Assistant or MQTT. The factory control panel stays in place.

platform:
  mcu: ESP32-S3                     # under review, see hardware/docs/decisions.md
  target: esp32s3                   # ESP32-C3 proposed; blocked on measurement M2

# Electrical envelope. Fill from datasheets and measurements — never from memory.
electrical:
  # Nothing here is measured yet. The supply figure is the manufacturer's nominal
  # value from the Vallox Digit2 SE manual; the range is not known until M1.
  supply_voltage: null              # manual states "n. 21 VDC" at the panel terminal
  current_idle: null
  current_peak: null
  interfaces:
    - "RS-485 half duplex, 9600 8N1, Vallox DIGIT protocol"
    - "Wi-Fi 2.4 GHz"

mechanical:
  enclosure_master: fusion          # fusion | code — see .claude/rules/mekaniikka.md
  dimensions: null
  material: null

# Hardware revisions. One entry per fabricated revision, newest last.
revisions: []
  # - rev: A
  #   date: 2026-09-01
  #   package: hardware/orders/revA-2026-09-01
  #   status: ordered               # planned | ordered | built
  #   cost: null
  #   notes: |
  #     Known issues found after assembly.

# Consumed by /pcba-order. This is stored judgement — do not re-derive it every order.
assembly:
  fab: pcbway
  surface_finish: hasl-lead-free
  solder_mask: Green
  silkscreen: White
  panelized: true
  mcu_blank: true                   # deliver MCU unprogrammed
  first_article: true
  no_substitute: []
    # - ref: U1
    #   reason: "exact part required"
  gotchas: []
  dnp: []
